[package]
name = "easy2type"
version = "0.4.0"
edition = "2021"
description = "Windows 桌面英文输入辅助工具 — Slint 孟菲斯风 + 模糊纠错"

[lib]
name = "easy2type"
path = "src/lib.rs"

[[bin]]
name = "easy2type"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
slint = { version = "1", optional = true }

[features]
default = []
slint-ui = ["slint"]

[build-dependencies]
slint-build = { version = "1", optional = true }
winres = "0.1"
