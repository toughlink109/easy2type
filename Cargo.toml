[package]
name = "easy2type"
version = "0.1.0"
edition = "2021"
description = "Windows 桌面英文输入辅助工具 — Inline 单词预测与补全"

[[bin]]
name = "easy2type"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
[build-dependencies]
# winres 需要 Windows SDK 的 rc.exe，MVP 阶段暂不引入
# 后续通过嵌入 manifest 文件设置 DPI 感知
