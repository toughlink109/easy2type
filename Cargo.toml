[package]
name = "easy2type"
version = "0.7.1"
edition = "2021"
description = "Windows 桌面英文输入辅助工具 — Slint 孟菲斯风 + 模糊纠错"

[lib]
name = "easy2type"
path = "src/lib.rs"

[[bin]]
name = "easy2type"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Ime",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_Common",
] }
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1", optional = true }

[features]
default = []
slint-ui = ["slint", "slint-build"]

[build-dependencies]
slint-build = { version = "1", optional = true }
winres = "0.1"
